# Refresh governors.json from the TrueSight DAO Main Ledger
# and commit it back to this repo so the EC2 service can fetch
# the canonical file via raw.githubusercontent.com.
#
# Runs on a schedule (daily) or via workflow_dispatch for manual refresh.
#
# Required secrets:
#   GOOGLE_CREDENTIALS_JSON  — service-account JSON with Sheets read access
#                              to the Main Ledger spreadsheet.
#
# Auth model: we use the default GITHUB_TOKEN (scoped via `permissions:` below)
# for the same-repo checkout + push. No PAT needed because this workflow only
# writes back to its OWN repository. If `main` ever gets branch protection that
# blocks GitHub Actions pushes, switch back to a fine-grained PAT
# (Contents: Read+Write on TrueSightDAO/governor_chatbot_service) wired to a
# repo-scoped secret like REFRESH_GOVERNORS_PUSH_TOKEN.
#
# The EC2 auth layer fetches:
#   https://raw.githubusercontent.com/TrueSightDAO/governor_chatbot_service/main/governors.json
# and caches it for GOVERNORS_CACHE_TTL_SECONDS (default: 300).

name: Refresh Governor Registry

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC (before most activity, after any overnight changes).
    - cron: "0 6 * * *"

permissions:
  # GITHUB_TOKEN needs write to commit + push the refreshed governors.json
  # back to main. Read defaults are preserved implicitly for everything else.
  contents: write

concurrency:
  group: refresh-governors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout governor_chatbot_service
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client

      - name: Refresh governors.json from Main Ledger
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOVERNORS_SPREADSHEET_ID: "1GE7PUq-UT6x2rBN-Q2ksogbWpgyuh2SaxJyG_uEK6PU"
          GOVERNORS_SHEET_TAB: "Contributors contact information"
        run: |
          python3 scripts/refresh_governors.py --output governors.json

      - name: Commit and push if changed
        run: |
          # actions/checkout@v4 already persisted GITHUB_TOKEN into .git/config,
          # so `git push origin main` here authenticates as github-actions[bot]
          # with the workflow-level `permissions: contents: write` granted above.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add governors.json
          if git diff --staged --quiet; then
            echo "No changes to governors.json — skipping commit."
          else
            git commit -m "chore(governors): refresh from Main Ledger [skip ci]"
            git push origin main
            echo "Committed updated governors.json"
          fi
