# Governor Chatbot — proxy to local/remote FastAPI service
# Add this inside the 'http' block of /etc/nginx/nginx.conf on krake_ng

upstream governor_chatbot {
    server 127.0.0.1:8000 max_fails=0;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name chatbot.truesight.me;
    rewrite ^/(.*)$ https://chatbot.truesight.me/$1 permanent;
}

# HTTPS proxy
server {
    listen 443;
    ssl on;
    server_name chatbot.truesight.me;

    # If running chatbot on krake_ng itself (port 8000), these paths work.
    # If running on a separate EC2, change proxy_pass to the EC2 internal IP:8000
    ssl_certificate_key /home/ubuntu/ssl_certs/truesight.key;
    ssl_certificate /home/ubuntu/ssl_certs/STAR_truesight_me.crt;

    add_header Strict-Transport-Security max-age=500;

    # CORS preflight
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://dapp.truesight.me' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Public-Key' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_pass http://governor_chatbot;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header 'Access-Control-Allow-Origin' 'https://dapp.truesight.me' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
}
